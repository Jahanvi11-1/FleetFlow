[# A generic, single database configuration.]

[alembic]
# Configuration notes:
# - This project uses Flask-Migrate/Flask app to provide the SQLAlchemy
#   engine at runtime. The migration `env.py` sets `sqlalchemy.url` from the
#   Flask application's database engine, so you normally do NOT need to set
#   `sqlalchemy.url` here when running migrations via the Flask app.
# - If you need to run Alembic directly from the command line (alembic CLI),
#   uncomment and set `sqlalchemy.url` below or provide it via the
#   `DATABASE_URL` environment variable.

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# SQLAlchemy URL (example). Keep commented when using Flask-Migrate.
# sqlalchemy.url = driver://username:password@host:port/dbname

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
